<div class="app-layout">
  <!-- Menú Lateral (Sidebar) -->
  <aside class="sidebar glass-panel">
    <div class="sidebar-header">
      <svg viewBox="0 0 24 24" width="36" height="36" stroke="var(--accent-cyan)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
      <h2>RADIA-OS</h2>
    </div>

    <!-- Perfil del Usuario -->
    <div class="user-profile">
      <!-- Muestra solo la primera letra del nombre -->
      <div class="avatar">{{ nombreUsuarioActual.charAt(0) | uppercase }}</div>
      <div class="user-info">
        <!-- Inyecta los datos reales -->
        <span class="user-name">{{ nombreUsuarioActual }}</span>
        <span class="user-role">{{ rolUsuarioActual | uppercase }}</span>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="sidebar-nav">
      <a routerLink="/sistema/estudiante" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        Worklist Pacientes
      </a>

      <!-- APLICACIÓN DE LA DIRECTIVA *ngIf PARA CATEDRÁTICOS/ADMINISTRADORES -->
      <a *ngIf="rolUsuarioActual === rolesPermitidos.CATEDRATICO || rolUsuarioActual === rolesPermitidos.ADMINISTRADOR" 
         routerLink="/sistema/catedratico" 
         routerLinkActive="active" 
         class="nav-item">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        Gestión Académica
      </a>
    </nav>

    <!-- Cerrar Sesión -->
    <div class="sidebar-footer">
      <!-- Evento para destruir el token JWT -->
      <a (click)="cerrarSesion()" class="nav-item logout" style="cursor: pointer;">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Cerrar Sesión
      </a>
    </div>
  </aside>

  <!-- Contenedor Principal Central -->
  <main class="main-content">
    <!-- El router-outlet es indispensable para que Angular pinte el Dashboard -->
    <router-outlet></router-outlet>
  </main>
</div>
