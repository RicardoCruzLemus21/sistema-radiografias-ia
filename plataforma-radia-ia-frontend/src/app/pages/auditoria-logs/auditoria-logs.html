<div class="audit-container">
  <header class="audit-header">
    <div class="header-titles">
      <h1>Auditoría y Actividad del Sistema</h1>
      <p>Monitoreo en tiempo real de las acciones de los usuarios en la plataforma.</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="cargarLogs()">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        Actualizar
      </button>
    </div>
  </header>

  <div class="spinner" *ngIf="cargando">Cargando logs de seguridad...</div>

  <div class="timeline-container glass-panel" *ngIf="!cargando && logs.length > 0">
    <div class="timeline-item" *ngFor="let log of logs">
      <div class="timeline-icon" [ngClass]="getIconClass(log.accion)">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      </div>
      <div class="timeline-content">
        <div class="timeline-header">
          <strong>{{ log.nombre_completo }}</strong> 
          <span class="timeline-action">{{ log.accion }}</span>
          <span class="timeline-time">{{ log.fecha_accion | date:'medium' }}</span>
        </div>
        <p class="timeline-detail">{{ log.detalle }}</p>
      </div>
    </div>
  </div>

  <div class="empty-state glass-panel" *ngIf="!cargando && logs.length === 0">
    <svg viewBox="0 0 24 24" width="48" height="48" stroke="var(--text-muted)" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <p>No hay registros de auditoría disponibles.</p>
  </div>
</div>
