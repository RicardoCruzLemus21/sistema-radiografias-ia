<div class="campana">
  <button type="button" class="campana-btn" (click)="alternar()" [attr.aria-expanded]="abierto" aria-label="Notificaciones">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span *ngIf="noLeidas > 0" class="campana-contador">{{ noLeidas }}</span>
  </button>

  <div *ngIf="abierto" class="campana-panel glass-panel">
    <div class="campana-cabecera">
      <h3 class="campana-titulo">Notificaciones</h3>
      <button type="button" class="campana-todas" *ngIf="noLeidas > 0" (click)="marcarTodasLeidas()">Marcar todas como leídas</button>
    </div>

    <div *ngIf="notificaciones.length === 0" class="campana-vacio">No tienes notificaciones.</div>

    <ng-container *ngIf="sinLeer.length > 0">
      <div class="campana-seccion">Sin leer ({{ sinLeer.length }})</div>
      <div *ngFor="let n of sinLeer" class="notif-item no-leida" (click)="marcarLeida(n)" role="button" tabindex="0">
        <div class="notif-contenido">
          <strong class="notif-titulo">{{ n.titulo }}</strong>
          <p class="notif-mensaje">{{ n.mensaje }}</p>
          <small class="notif-fecha">{{ n.fecha_creacion | date:'short' }}</small>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="leidas.length > 0">
      <div class="campana-seccion">Leídas</div>
      <div *ngFor="let n of leidas" class="notif-item">
        <div class="notif-contenido">
          <strong class="notif-titulo">{{ n.titulo }}</strong>
          <p class="notif-mensaje">{{ n.mensaje }}</p>
          <small class="notif-fecha">{{ n.fecha_creacion | date:'short' }}</small>
        </div>
      </div>
    </ng-container>
  </div>
</div>
