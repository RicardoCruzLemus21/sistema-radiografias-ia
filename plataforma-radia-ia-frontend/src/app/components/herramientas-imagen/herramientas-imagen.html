<div class="hi-barra" (click)="$event.stopPropagation()">
  <button type="button" class="hi-btn" [class.activo]="invertir" (click)="invertir = !invertir" title="Invertir colores">
    Invertir
  </button>

  <label class="hi-control" title="Brillo de la imagen">
    <span>Brillo</span>
    <input type="range" min="50" max="150" step="5" [(ngModel)]="brillo" aria-label="Brillo">
    <span class="hi-valor">{{ brillo }}%</span>
  </label>

  <div class="hi-zoom" role="group" aria-label="Zoom">
    <button type="button" class="hi-btn hi-btn-icono" (click)="cambiarZoom(-0.25)" [disabled]="zoom <= 0.5" aria-label="Alejar">−</button>
    <button type="button" class="hi-btn hi-btn-texto" (click)="restablecerZoom()" title="Restablecer zoom">{{ (zoom * 100) | number:'1.0-0' }}%</button>
    <button type="button" class="hi-btn hi-btn-icono" (click)="cambiarZoom(0.25)" [disabled]="zoom >= 3" aria-label="Acercar">+</button>
  </div>

  <button type="button" class="hi-btn" (click)="rotar()" title="Girar la imagen 90 grados" aria-label="Rotar 90 grados">
    <svg class="hi-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
    Rotar
  </button>

  <button type="button" class="hi-btn" [class.activo]="senalizando" [disabled]="soloLectura"
          (click)="senalizando = !senalizando" title="Activa el modo para marcar una zona con el clic sostenido">
    Marcar zona de sospecha
  </button>
  <p class="hi-ayuda" *ngIf="senalizando && !soloLectura">Mantén el clic y arrastra sobre la zona.</p>

  <button type="button" class="hi-btn" (click)="borrarMarcas()" [disabled]="soloLectura || marcas.length === 0">
    Borrar marcas
  </button>

  <button *ngIf="ampliable" type="button" class="hi-btn" (click)="alternarAmpliado()" [attr.aria-label]="ampliado ? 'Cerrar vista ampliada' : 'Ampliar imagen'">
    {{ ampliado ? 'Cerrar' : 'Ampliar' }}
  </button>
</div>

<div class="hi-marco" (wheel)="alRueda($event)">
  <div class="hi-contenido" #lienzo [style.transform]="'translate(' + tx + 'px, ' + ty + 'px) rotate(' + rotacion + 'deg) scale(' + zoom + ')'"
       [class.dibujando]="senalizando && !soloLectura" [class.desplazable]="!(senalizando && !soloLectura) && zoom > 1"
       (pointerdown)="iniciarTrazo($event)" (pointermove)="moverTrazo($event)"
       (pointerup)="terminarTrazo()" (pointercancel)="terminarTrazo()" (dragstart)="$event.preventDefault()">
    <ng-content></ng-content>

    <div class="hi-marca" *ngFor="let m of marcas"
         [style.left.%]="m.x" [style.top.%]="m.y" [style.width.%]="m.w" [style.height.%]="m.h"></div>
    <div class="hi-marca en-curso" *ngIf="trazo"
         [style.left.%]="trazo.x" [style.top.%]="trazo.y" [style.width.%]="trazo.w" [style.height.%]="trazo.h"></div>
  </div>
</div>
